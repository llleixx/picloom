name: picloom-postgres
services:
  picloom:
    image: llleixx/picloom:latest
    init: true
    restart: unless-stopped
    stop_grace_period: 60s
    ports:
      - "${PUBLISH_ADDRESS:-0.0.0.0}:${HTTP_PORT:-3000}:3000"
    environment:
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?Set ENCRYPTION_KEY in docker/.env}
      INITIAL_OWNER_PASSWORD: ${INITIAL_OWNER_PASSWORD:-}
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:-}
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-}
      DATABASE_URL: postgresql://picloom:${POSTGRES_PASSWORD:?Set a URL-safe POSTGRES_PASSWORD in docker/.env}@postgres:5432/picloom
    volumes:
      - picloom-state:/var/lib/picloom
    depends_on:
      postgres:
        condition: service_healthy
  postgres:
    image: postgres:16-bookworm
    restart: unless-stopped
    stop_grace_period: 60s
    environment:
      POSTGRES_USER: picloom
      POSTGRES_DB: picloom
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in docker/.env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U picloom -d picloom"]
      interval: 5s
      timeout: 5s
      retries: 12
volumes:
  picloom-state:
  postgres-data:
