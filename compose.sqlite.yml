name: picloom-sqlite
services:
  picloom:
    image: llleixx/picloom:latest
    init: true
    restart: unless-stopped
    stop_grace_period: 60s
    ports:
      - "${PUBLISH_ADDRESS:-0.0.0.0}:${HTTP_PORT:-7425}:7425"
    environment:
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?Set ENCRYPTION_KEY in .env}
      INITIAL_OWNER_PASSWORD: ${INITIAL_OWNER_PASSWORD:-}
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:-}
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-}
      DATABASE_URL: ""
    volumes:
      - ./data:/var/lib/picloom
